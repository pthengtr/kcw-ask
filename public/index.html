<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>KCW ค้นหาสินค้า</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=13" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <h1>KCW ค้นหาสินค้า</h1>
          <p class="tag" id="modeTag">PARTS9 · ชื่อคอลัมน์ไทยตาม ICMAS</p>
        </div>
      </div>
      <div class="top-actions">
        <span class="pill" id="statusPill">พร้อมค้นหา</span>
        <button type="button" id="newChat" class="ghost"><span class="long">ล้าง</span><span class="short" aria-hidden="true">ล้าง</span></button>
      </div>
    </header>

    <main id="thread" class="thread" aria-live="polite"></main>

    <footer class="composer">
      <form id="form">
        <textarea
          id="input"
          rows="2"
          placeholder="ชื่อสินค้า / ขนาด / ยี่ห้อ / รหัสสินค้า"
          autocomplete="off"
        ></textarea>
        <button type="submit" id="send">ส่ง</button>
      </form>
      <p class="hint" id="hint">เช่น ซีล 31×46×7 · ลูกปืน 6207 · pcode:90915-YZZD1</p>
    </footer>
  </div>

  <div id="loadingOverlay" class="loading-overlay" hidden>
    <div class="loading-card">
      <span class="spinner spinner-lg" aria-hidden="true"></span>
      <p id="loadingText">กำลังประมวลผล…</p>
    </div>
  </div>

  <script type="module" src="/app.js?v=13"></script>
</body>
</html>
